<svg width="64" height="64" viewBox="0 0 204 204" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- The glass box with the U from logo.svg, moved so the box starts at 0,0 -->
  <defs>
    <!-- Diagonal glass gradient -->
    <linearGradient id="boxGrad" x1="0" y1="0" x2="204" y2="204" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Top-edge glass highlight -->
    <linearGradient id="boxShine" x1="102" y1="0" x2="102" y2="109.556" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Drop shadow for U letter -->
    <filter id="uShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.778" stdDeviation="3.778" flood-color="#78350F" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Main glass body -->
  <rect width="204" height="204" fill="url(#boxGrad)"/>

  <!-- Frosted glass highlight (elliptical light catch at top; the icon's edge clips it) -->
  <ellipse cx="102" cy="-11.333" rx="113.333" ry="83.111" fill="url(#boxShine)"/>

  <!-- Glass outer edge -->
  <rect x="1.889" y="1.889" width="200.222" height="200.222" stroke="#FFF" stroke-opacity="0.15" stroke-width="3.778"/>

  <!-- Glass inner bevel -->
  <rect x="5.667" y="5.667" width="192.667" height="192.667" stroke="#FFF" stroke-opacity="0.05" stroke-width="3.778"/>

  <!-- U letter (white on glass, with subtle shadow for depth) -->
  <g fill="white" filter="url(#uShadow)">
    <rect x="50" y="27" width="32" height="150"/>
    <rect x="122" y="27" width="32" height="150"/>
    <rect x="50" y="145" width="104" height="32"/>
  </g>
</svg>
