<svg width="830" height="270" viewBox="0 0 830 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Amber gradient for Q, A, R letterforms -->
    <linearGradient id="letterGrad" x1="0" y1="44.475" x2="0" y2="245.477" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>

    <!-- Diagonal glass gradient for central box -->
    <linearGradient id="boxGrad" x1="241" y1="33" x2="445" y2="237" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>

    <!-- Top-edge glass highlight -->
    <linearGradient id="boxShine" x1="343" y1="33" x2="343" y2="142.556" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFF" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FFF" stop-opacity="0"/>
    </linearGradient>

    <!-- Bracket gradient -->
    <linearGradient id="bracketGrad" x1="0" y1="0" x2="830" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FBBF24" stop-opacity="0.5"/>
      <stop offset="50%" stop-color="#F59E0B" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.5"/>
    </linearGradient>

    <!-- Ambient glow filter for central box -->
    <filter id="boxGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18.889" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Drop shadow for U letter -->
    <filter id="uShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3.778" stdDeviation="3.778" flood-color="#78350F" flood-opacity="0.45"/>
    </filter>

    <!-- Clip path for glass highlight shape -->
    <clipPath id="boxClip">
      <rect x="241" y="33" width="204" height="204"/>
    </clipPath>
  </defs>

  <!-- ═══ Corner Brackets ═══ -->
  <g stroke="url(#bracketGrad)" stroke-width="16" stroke-linejoin="miter">
    <path d="M96 8 L8 8 L8 96"/>
    <path d="M734 8 L822 8 L822 96"/>
    <path d="M8 174 L8 262 L96 262"/>
    <path d="M822 174 L822 262 L734 262"/>
  </g>

  <!-- ═══ Central Box — Glass Effect ═══ -->
  <!-- Ambient glow halo -->
  <rect x="248.556" y="40.556" width="188.889" height="188.889" fill="#F59E0B" opacity="0.12" filter="url(#boxGlow)"/>

  <!-- Main glass body -->
  <rect x="241" y="33" width="204" height="204" fill="url(#boxGrad)"/>

  <!-- Frosted glass highlight (elliptical light catch at top) -->
  <g clip-path="url(#boxClip)">
    <ellipse cx="343" cy="21.667" rx="113.333" ry="83.111" fill="url(#boxShine)"/>
  </g>

  <!-- Glass outer edge -->
  <rect x="242.889" y="34.889" width="200.222" height="200.222" stroke="#FFF" stroke-opacity="0.15" stroke-width="3.778"/>

  <!-- Glass inner bevel -->
  <rect x="246.667" y="38.667" width="192.667" height="192.667" stroke="#FFF" stroke-opacity="0.05" stroke-width="3.778"/>

  <!-- U letter (white on glass, with subtle shadow for depth) -->
  <g fill="white" filter="url(#uShadow)">
    <rect x="291" y="60" width="32" height="150"/>
    <rect x="363" y="60" width="32" height="150"/>
    <rect x="291" y="178" width="104" height="32"/>
  </g>

  <!-- ═══ Letter Forms (gold-to-amber gradient) ═══ -->
  <g fill="url(#letterGrad)">
    <!-- Q -->
    <rect x="81" y="60" width="32" height="150"/>
    <rect x="153" y="60" width="32" height="150"/>
    <rect x="81" y="60" width="104" height="32"/>
    <rect x="81" y="178" width="104" height="32"/>
    <polygon points="137.523,193.151 189.849,245.477 212.477,222.849 160.151,170.523"/>
    <!-- A -->
    <rect x="487" y="60" width="32" height="150"/>
    <rect x="559" y="60" width="32" height="150"/>
    <rect x="487" y="60" width="104" height="32"/>
    <rect x="487" y="123" width="104" height="32"/>
    <!-- R -->
    <rect x="629" y="60" width="32" height="150"/>
    <rect x="629" y="60" width="104" height="32"/>
    <rect x="701" y="60" width="32" height="79"/>
    <rect x="629" y="123" width="104" height="32"/>
    <polygon points="721.627,219.255 744.255,196.627 676.373,128.745 653.745,151.373"/>
  </g>
</svg>
